name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          echo "SDKMANAGER=$SDKMGR" >> "$GITHUB_ENV"
          "$SDKMGR" --version

      - name: Install Android 35
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy web app into Android assets
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/assets android-app/app/src/main/res/drawable
          cp index.html app.js styles.css sw.js manifest.webmanifest android-app/app/src/main/assets/
          cp -R assets android-app/app/src/main/assets/
          cp assets/icon-192.png android-app/app/src/main/res/drawable/app_icon.png
          sed -i 's|href="/styles.css"|href="styles.css"|g; s|src="/app.js"|src="app.js"|g; s|href="/manifest.webmanifest"|href="manifest.webmanifest"|g; s|href="/assets/icon.svg"|href="assets/icon.svg"|g' android-app/app/src/main/assets/index.html

      - name: Validate chart JavaScript
        run: node --check app.js

      - name: Compile installable debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Chart-Studio-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FILE="android-app/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 "$FILE#XAU-Chart-Studio.apk" --clobber
          else
            gh release create v1.1.0 "$FILE#XAU-Chart-Studio.apk" \
              --title "XAU Chart Studio v1.1.0 (APK Uji Coba)" \
              --notes "APK Android instal langsung. Drawing tools lengkap, simpan lokal, dan mode DEMO. Candle XAUUSD asli via Twelve Data: buka Setelan, tempel API key pribadi, Simpan API Key, lalu Hubungkan. Key terenkripsi pada Android Keystore, tidak ada di APK atau GitHub. Ketersediaan data tergantung paket dan kuota Twelve Data. Build debug-signed untuk pengujian pribadi."
          fi
